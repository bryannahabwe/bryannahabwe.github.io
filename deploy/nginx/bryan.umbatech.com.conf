# bryan.umbatech.com server blocks — paste inside the `http { … }` block of the shared
# nginx.conf (next to umbatech.com). Relies on the file's existing global
# `resolver 127.0.0.11 …;` for the variable-based proxy_pass.
# Certificate: the shared /etc/letsencrypt/live/umbatech.com/ certificate, whose
# *.umbatech.com wildcard covers bryan.umbatech.com. No separate certificate is needed.

# ---- Nahabwe Brian portfolio (bryan.umbatech.com) ----
server {
  listen 80;
  server_name bryan.umbatech.com;
  return 301 https://bryan.umbatech.com$request_uri;
}
server {
  listen 443 ssl;
  server_name bryan.umbatech.com;
  ssl_certificate     /etc/letsencrypt/live/umbatech.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/umbatech.com/privkey.pem;

  # Static site: nothing is uploaded.
  client_max_body_size 64k;

  location / {
    set $upstream http://bryan-portfolio:80;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
