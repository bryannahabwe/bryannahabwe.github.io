# nginx inside the bryan-portfolio container. TLS is terminated by the shared
# `nginx` container, which proxies bryan.umbatech.com here on port 80.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;   # keep redirects relative so they stay on https

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

  # Fingerprinted Astro assets never change.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Must always be re-checked so the old CRA service worker gets unregistered.
  location = /service-worker.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
